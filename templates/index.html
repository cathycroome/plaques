<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plaque Compass</title>
<style>
  :root {
    --ink: #12202c;
    --plaque-blue: #1d4d73;
    --plaque-blue-light: #2e6690;
    --brass: #c9a15a;
    --brass-bright: #e4c17e;
    --paper: #f2ece0;
    --paper-dim: #d9d0bd;
    --line: rgba(201, 161, 90, 0.35);
    --font-display: 'Iowan Old Style', Georgia, serif;
    --font-body: Georgia, serif;
    --font-mono: 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }
  .wrap { width: 100%; max-width: 960px; }
  header { text-align: center; margin-bottom: 40px; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--brass); margin-bottom: 14px;
  }
  h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 44px); margin: 0 0 12px; }
  .sub { color: var(--paper-dim); font-size: 15px; max-width: 460px; margin: 0 auto; line-height: 1.5; }
  .stage {
    display: grid;
    grid-template-columns: minmax(280px, 380px) 1fr;
    gap: 40px;
    align-items: start;
  }
  @media (max-width: 680px) {
    .stage { grid-template-columns: 1fr; justify-items: center; }
  }
  .dial-holder { position: relative; width: 100%; max-width: 380px; }
  svg.dial { width: 100%; height: auto; overflow: visible; }
  .wedge {
    fill: rgba(46, 102, 144, 0.28); stroke: var(--line); stroke-width: 1;
    cursor: pointer; transition: fill 0.25s ease;
  }
  .wedge:hover { fill: rgba(46, 102, 144, 0.55); }
  .wedge.active { fill: var(--brass); stroke: var(--brass-bright); }
  .wedge-label {
    font-family: var(--font-mono); font-size: 10.5px; fill: var(--paper-dim);
    text-anchor: middle; pointer-events: none; letter-spacing: 0.02em;
  }
  .wedge-label.active { fill: var(--ink); font-weight: 700; }
  .dial-hub { fill: var(--ink); stroke: var(--brass); stroke-width: 1.5; }
  .dial-hub-ring { fill: none; stroke: var(--line); stroke-width: 1; }
  form {
    display: flex; flex-direction: column; gap: 22px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line); border-radius: 8px; padding: 28px;
  }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--brass);
  }
  select, input[type="range"], input[type="number"] { accent-color: var(--brass); }
  select, input[type="number"] {
    background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--paper);
    padding: 10px 12px; border-radius: 4px; font-family: var(--font-body); font-size: 15px;
  }
  .range-row { display: flex; align-items: center; gap: 12px; }
  .range-row input[type="range"] { flex: 1; }
  .range-value { font-family: var(--font-mono); font-size: 13px; min-width: 68px; text-align: right; }
  .checkbox-row { display: flex; align-items: center; gap: 10px; }
  .checkbox-row label { text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--paper); font-family: var(--font-body); }
  button {
    background: var(--brass); color: var(--ink); border: none; padding: 14px 20px;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em;
    text-transform: uppercase; font-weight: 700; border-radius: 4px; cursor: pointer;
  }
  button:hover { background: var(--brass-bright); }
  button:disabled { opacity: 0.6; cursor: default; }

  /* ---------- Centre point control ---------- */
  .centre-options {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .centre-btn {
    background: rgba(255,255,255,0.05); color: var(--paper-dim);
    border: 1px solid var(--line); padding: 9px 14px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; font-weight: 700; border-radius: 20px; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .centre-btn:hover { border-color: var(--brass-bright); color: var(--paper); }
  .centre-btn.active { background: var(--brass); color: var(--ink); border-color: var(--brass); }
  .centre-status {
    font-family: var(--font-mono); font-size: 12px; color: var(--paper-dim);
  }
  .manual-coords {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding-top: 4px;
  }
  .manual-coords .field { gap: 6px; }
  .manual-coords label { font-size: 10px; }

  .result-area { margin-top: 40px; }
  .plaque {
    background: radial-gradient(circle at 30% 20%, var(--plaque-blue-light), var(--plaque-blue) 70%);
    border: 3px solid var(--brass); border-radius: 50% / 20%; padding: 40px 34px; text-align: center;
    animation: reveal 0.4s ease;
  }
  @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .plaque .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--brass-bright); margin-bottom: 14px; }
  .plaque h2 { font-family: var(--font-display); font-size: clamp(22px, 4vw, 30px); margin: 0 0 8px; }
  .plaque .subject { font-family: var(--font-mono); font-size: 13px; color: var(--brass-bright); margin-bottom: 8px; }
  .plaque .meta { display: flex; justify-content: center; align-items: center; gap: 26px; font-size: 14px; color: var(--paper-dim); border-top: 1px solid rgba(228,193,126,0.3); padding-top: 16px; }
  .plaque .meta strong { display: block; font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; color: var(--paper); margin-bottom: 4px; }
  .map-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--brass-bright); text-decoration: none;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px;
    transition: background 0.2s ease;
  }
  .map-link:hover { background: rgba(228,193,126,0.15); }
  .map-link svg { width: 14px; height: 14px; flex-shrink: 0; }
  .empty-state, .error-state {
    text-align: center; color: var(--paper-dim); font-size: 14px;
    padding: 26px 20px; border: 1px dashed var(--line); border-radius: 6px;
  }
  .error-state { color: var(--brass-bright); }
  .plaque .org {
    font-size: 13px;
    color: var(--paper-dim);
    font-style: italic;
    margin-top: 10px;
    margin-bottom: 18px;
  }
  @media (prefers-reduced-motion: reduce) { .plaque { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">A random plaque</div>
    <h1>Plaque Compass</h1>
    <p class="sub">Every plaque sits at a bearing from a centre point. Pick a centre and a month, and find a plaque within the corresponding slice.</p>
  </header>
  <div class="stage">
    <div class="dial-holder">
      <svg class="dial" viewBox="-140 -140 280 280" role="img" aria-label="Clock dial for choosing a month"></svg>
    </div>
    <form id="plaqueForm">
      <div class="field">
        <label for="month">Month</label>
        <select name="month" id="month">
          {% for m in months %}
            <option value="{{ m }}">{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="max_distance">Maximum distance from centre</label>
        <div class="range-row">
          <input type="range" id="max_distance" min="5" max="500" step="5" value="500">
          <span class="range-value" id="distanceValue">500 km</span>
        </div>
      </div>

      <div class="field">
        <label>Centre</label>
        <div class="centre-options">
          <button type="button" class="centre-btn" id="use_my_location">Current location</button>
          <button type="button" class="centre-btn active" id="centre_default" data-lat="{{ default_centre_lat }}" data-long="{{ default_centre_long }}">Stockport</button>
          <button type="button" class="centre-btn" id="centre_manchester" data-lat="53.477917" data-long="-2.244250">Manchester</button>
          <button type="button" class="centre-btn" id="centre_brighton" data-lat="50.8288" data-long="-0.1411">Brighton</button>
          <button type="button" class="centre-btn" id="centre_chapel_allerton" data-lat="53.829831" data-long="-1.538291">Chapel Allerton</button>
          <button type="button" class="centre-btn" id="toggle_manual_entry">Enter manually</button>
        </div>
        <span class="centre-status" id="location_status">Using Stockport</span>
        <div class="manual-coords" id="manual_entry" hidden>
          <div class="field">
            <label for="centre_lat">Latitude</label>
            <input type="number" step="any" id="centre_lat" name="centre_lat" value="{{ default_centre_lat }}">
          </div>
          <div class="field">
            <label for="centre_long">Longitude</label>
            <input type="number" step="any" id="centre_long" name="centre_long" value="{{ default_centre_long }}">
          </div>
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="blue_only">
        <label for="blue_only">Blue plaques only</label>
      </div>
      <button type="submit" id="findButton">Find a plaque</button>
    </form>
  </div>
  <div class="result-area" id="resultArea">
    <div class="empty-state">Choose your options and press "Find a plaque" to begin.</div>
  </div>
</div>
<script>
// ---------- Month -> angle slice, clockwise from 12 o'clock (90°) ----------
const MONTH_ANGLES = {
  'January':   [60, 90],
  'February':  [30, 60],
  'March':     [0, 30],
  'April':     [330, 360],
  'May':       [300, 330],
  'June':      [270, 300],
  'July':      [240, 270],
  'August':    [210, 240],
  'September': [180, 210],
  'October':   [150, 180],
  'November':  [120, 150],
  'December':  [90, 120],
};
const MONTHS = Object.keys(MONTH_ANGLES);
const monthSelect = document.getElementById('month');
// ---------- Build the clock dial ----------
const svgNS = 'http://www.w3.org/2000/svg';
const dial = document.querySelector('svg.dial');
const R_OUTER = 130;
const R_INNER = 54;
const R_LABEL = 92;
function polarToXY(deg, radius) {
  const rad = deg * Math.PI / 180;
  return { x: radius * Math.cos(rad), y: -radius * Math.sin(rad) };
}
function wedgePath(low, high) {
  const a = polarToXY(low, R_OUTER);
  const b = polarToXY(high, R_OUTER);
  const ai = polarToXY(low, R_INNER);
  const bi = polarToXY(high, R_INNER);
  const largeArc = (high - low + 360) % 360 > 180 ? 1 : 0;
  return [
    `M ${ai.x.toFixed(2)} ${ai.y.toFixed(2)}`,
    `L ${a.x.toFixed(2)} ${a.y.toFixed(2)}`,
    `A ${R_OUTER} ${R_OUTER} 0 ${largeArc} 0 ${b.x.toFixed(2)} ${b.y.toFixed(2)}`,
    `L ${bi.x.toFixed(2)} ${bi.y.toFixed(2)}`,
    `A ${R_INNER} ${R_INNER} 0 ${largeArc} 1 ${ai.x.toFixed(2)} ${ai.y.toFixed(2)}`,
    'Z'
  ].join(' ');
}
const wedgeEls = {};
const labelEls = {};
MONTHS.forEach(month => {
  const [low, high] = MONTH_ANGLES[month];
  const path = document.createElementNS(svgNS, 'path');
  path.setAttribute('d', wedgePath(low, high));
  path.setAttribute('class', 'wedge');
  path.addEventListener('click', () => selectMonth(month));
  dial.appendChild(path);
  wedgeEls[month] = path;
  const mid = (low + high) / 2 + (high < low ? 180 : 0);
  const pos = polarToXY(mid, R_LABEL);
  const text = document.createElementNS(svgNS, 'text');
  text.setAttribute('x', pos.x.toFixed(2));
  text.setAttribute('y', pos.y.toFixed(2));
  text.setAttribute('class', 'wedge-label');
  text.setAttribute('dominant-baseline', 'middle');
  text.textContent = month.slice(0, 3);
  dial.appendChild(text);
  labelEls[month] = text;
});
// hub
const hubRing = document.createElementNS(svgNS, 'circle');
hubRing.setAttribute('cx', 0); hubRing.setAttribute('cy', 0);
hubRing.setAttribute('r', R_INNER - 4);
hubRing.setAttribute('class', 'dial-hub-ring');
dial.appendChild(hubRing);
const hub = document.createElementNS(svgNS, 'circle');
hub.setAttribute('cx', 0); hub.setAttribute('cy', 0);
hub.setAttribute('r', R_INNER - 10);
hub.setAttribute('class', 'dial-hub');
dial.appendChild(hub);
function selectMonth(month) {
  monthSelect.value = month;
  MONTHS.forEach(m => {
    wedgeEls[m].classList.toggle('active', m === month);
    labelEls[m].classList.toggle('active', m === month);
  });
}
// dropdown -> dial sync
monthSelect.addEventListener('change', () => selectMonth(monthSelect.value));
selectMonth(monthSelect.value || MONTHS[0]);

// ---------- Centre point: presets, geolocation, manual entry ----------
const manualEntry = document.getElementById('manual_entry');
const toggleManualBtn = document.getElementById('toggle_manual_entry');
const locationStatus = document.getElementById('location_status');
const centreLatInput = document.getElementById('centre_lat');
const centreLongInput = document.getElementById('centre_long');
const centreButtons = [
  document.getElementById('centre_default'),
  document.getElementById('centre_manchester'),
  document.getElementById('centre_brighton'),
  document.getElementById('centre_chapel_allerton'),
  document.getElementById('use_my_location'),
  document.getElementById('toggle_manual_entry'),
];

function setActiveCentreButton(btn) {
  centreButtons.forEach(b => b.classList.toggle('active', b === btn));
}

function setCentre(lat, long, label, btn) {
  centreLatInput.value = lat;
  centreLongInput.value = long;
  locationStatus.textContent = 'Using ' + label;
  setActiveCentreButton(btn);
}

document.getElementById('centre_default').addEventListener('click', function () {
  manualEntry.hidden = true;
  setCentre(this.dataset.lat, this.dataset.long, 'Stockport', this);
});

document.getElementById('centre_manchester').addEventListener('click', function () {
  manualEntry.hidden = true;
  setCentre(this.dataset.lat, this.dataset.long, 'Manchester', this);
});

document.getElementById('centre_brighton').addEventListener('click', function () {
  manualEntry.hidden = true;
  setCentre(this.dataset.lat, this.dataset.long, 'Brighton', this);
});

document.getElementById('centre_chapel_allerton').addEventListener('click', function () {
  manualEntry.hidden = true;
  setCentre(this.dataset.lat, this.dataset.long, 'Chapel Allerton', this);
});

toggleManualBtn.addEventListener('click', function () {
  manualEntry.hidden = !manualEntry.hidden;
  if (!manualEntry.hidden) {
    locationStatus.textContent = 'Enter coordinates below';
    setActiveCentreButton(this);
  }
});

document.getElementById('use_my_location').addEventListener('click', function () {
  if (!('geolocation' in navigator)) {
    locationStatus.textContent = "Geolocation not supported on this browser";
    return;
  }
  manualEntry.hidden = true;
  locationStatus.textContent = 'Locating…';
  const btn = this;
  navigator.geolocation.getCurrentPosition(
    (position) => {
      setCentre(
        position.coords.latitude.toFixed(6),
        position.coords.longitude.toFixed(6),
        'your current location',
        btn
      );
    },
    () => {
      locationStatus.textContent = "Couldn't get your location, try another option";
      setActiveCentreButton(null);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

const form = document.getElementById('plaqueForm');
const distanceInput = document.getElementById('max_distance');
const distanceValue = document.getElementById('distanceValue');
const resultArea = document.getElementById('resultArea');
const findButton = document.getElementById('findButton');
distanceInput.addEventListener('input', () => {
  distanceValue.textContent = distanceInput.value + ' km';
});
function parseOrganisations(raw) {
  if (!raw) return [];
  const inner = String(raw).trim().replace(/^\[|\]$/g, '').trim();
  if (!inner) return [];
  return inner
    .split(',')
    .map(s => s.trim().replace(/^['"]|['"]$/g, ''))
    .filter(Boolean);
}
function renderPlaque(p) {
  const orgs = parseOrganisations(p.organisations);
  const orgLine = orgs.length
  ? `<div class="org">${orgs.join(' and ')}</div>`
  : '';
  resultArea.innerHTML = `
    <div class="plaque">
      <div class="kicker">${p.colour || 'unmarked'} plaque · ${p.area || 'UK'}</div>
      <h2>${p.lead_subject_name || 'Untitled plaque'}</h2>
      <div class="subject">${p.inscription || ''}</div>
      ${orgLine}
      <div class="meta">
        <div><strong>Distance</strong>${Number(p.km).toFixed(1)} km</div>
        <div><strong>Bearing</strong>${Number(p.theta_deg).toFixed(1)}°</div>
        ${p.maps_url ? `<div><a class="map-link" href="${p.maps_url}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C7.86 2 4.5 5.36 4.5 9.5c0 5.5 7.5 12.5 7.5 12.5s7.5-7 7.5-12.5C19.5 5.36 16.14 2 12 2zm0 10.25a2.75 2.75 0 1 1 0-5.5 2.75 2.75 0 0 1 0 5.5z"/></svg>
          Maps
        </a></div>` : ''}
      </div>
    </div>`;
}
function renderEmpty(message) {
  resultArea.innerHTML = `<div class="empty-state">${message}</div>`;
}
function renderError() {
  resultArea.innerHTML = `<div class="error-state">Something went wrong reaching the server. Try again.</div>`;
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const month = document.getElementById('month').value;
  const maxDistance = distanceInput.value;
  const blueOnly = document.getElementById('blue_only').checked;
  const params = new URLSearchParams({ month, max_distance: maxDistance });
  if (blueOnly) params.append('blue_only', 'on');
  if (centreLatInput.value) params.append('centre_lat', centreLatInput.value);
  if (centreLongInput.value) params.append('centre_long', centreLongInput.value);
  findButton.disabled = true;
  findButton.textContent = 'Searching…';
  try {
    const res = await fetch(`/random?${params.toString()}`);
    const data = await res.json();
    if (data.found) {
      renderPlaque(data.plaque);
    } else {
      renderEmpty(data.message || 'No plaques found for this specification.');
    }
  } catch (err) {
    console.error(err);
    renderError();
  } finally {
    findButton.disabled = false;
    findButton.textContent = 'Find a plaque';
  }
});
</script>
</body>
</html>
